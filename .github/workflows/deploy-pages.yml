name: Deploy to GitHub Pages

# PRODUCTION deploys come from main ONLY. A feature-branch trigger here once
# let a stale parallel branch overwrite the live site with a 10-day-old build —
# never add branches back; merge to main to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via the built-in GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; let a newer run supersede an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (Pages base)
    # Hard guard: even if a branch re-adds itself to the triggers, only main
    # (or a manual dispatch) may publish to the live site.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          # Project-site sub-path, derived from the repo name (casing-safe).
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          # Supabase anon (publishable) key — public by design (RLS-protected),
          # shipped in the client bundle. Prefer repo secrets/vars if set.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://suqbnksyfmzfhrfwuhrw.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cWJua3N5Zm16ZmhyZnd1aHJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTA2MjcsImV4cCI6MjEwMjA2NjYyN30.8oIT-HV7fOND5ucqCW3hAe9spjCsS97aSPS0VAoeqN8' }}

      - name: SPA + PWA deep-link fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
