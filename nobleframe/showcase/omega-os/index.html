<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; child-src 'self'; frame-src *; media-src 'self' blob: data:;" />
    <meta name="theme-color" content="#08080A" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Noir/goldenes Desktop-OS mit gebundener alchemistischer KI." />
    <!-- PWA / Mobile (Android + iOS) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OMEGA" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>OMEGA OS</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #08080A; overflow: hidden; }
      /* Touch-Grundlagen: kein Tap-Highlight, kein Doppeltipp-Zoom, kein Überscroll, kein Textselektions-Lasso. */
      * { -webkit-tap-highlight-color: transparent; }
      html, body { overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* Eingaben bleiben selektierbar und editierbar. */
      input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
      webview { display: inline-flex; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>
