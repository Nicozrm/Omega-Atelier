    <style>
        :root{--gold:#C9A962;--gold-light:#E8D5A3;--black:#000;--white:#FAFAFA;--white-muted:rgba(250,250,250,.75);--white-subtle:rgba(250,250,250,.55);--gradient:linear-gradient(135deg,#C9A962 0%,#E8D5A3 50%,#C9A962 100%)}
        *{margin:0;padding:0;box-sizing:border-box}
        html{background:#000;color-scheme:dark;scroll-behavior:smooth;overflow-x:hidden}
        body{font-family:'Outfit',sans-serif;background:#000;color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px;position:relative;overflow:hidden;line-height:1.6}
        .ambient{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none}
        .a1{width:560px;height:560px;background:rgba(201,169,98,.06);top:-220px;right:-160px}
        .a2{width:420px;height:420px;background:rgba(201,169,98,.04);bottom:-180px;left:-160px}
        .frame{position:fixed;inset:22px;border:1px solid rgba(201,169,98,.18);pointer-events:none}
        .frame::before{content:'';position:absolute;inset:11px;border:1px solid rgba(201,169,98,.07)}
        .content{position:relative;z-index:2;max-width:560px}
        .logo{display:inline-flex;align-items:center;gap:14px;text-decoration:none;margin-bottom:54px}
        .logo .glyph{width:34px;height:34px;position:relative}
        .logo .glyph::before{content:'';position:absolute;inset:0;border:2px solid var(--gold)}
        .logo .glyph::after{content:'';position:absolute;inset:8px;border:1px solid var(--gold)}
        .logo .name{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.55rem;letter-spacing:6px;color:var(--white)}
        .logo .name b{font-weight:500;color:var(--gold)}
        .eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
        .code{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(110px,22vw,200px);line-height:.9;margin-bottom:14px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.8rem,4vw,2.7rem);margin-bottom:18px}
        p{color:var(--white-muted);font-size:1.02rem;max-width:420px;margin:0 auto 38px;line-height:1.8}
        .btn{display:inline-flex;align-items:center;gap:12px;padding:16px 38px;font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#000;background:var(--gold);transition:transform .3s ease,box-shadow .3s ease;will-change:transform}
        .btn:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(201,169,98,.22)}
        .links{margin-top:46px;display:flex;flex-wrap:wrap;gap:14px 30px;justify-content:center}
        .links a{color:var(--white-subtle);text-decoration:none;font-size:.86rem;letter-spacing:.02em;transition:color .3s ease;position:relative}
        .links a::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:1px;background:var(--gold);transition:width .3s ease}
        .links a:hover{color:var(--gold)}
        .links a:hover::after{width:100%}
        a:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
        @media(max-width:560px){.frame{inset:12px}.logo{margin-bottom:38px}}
    </style>
