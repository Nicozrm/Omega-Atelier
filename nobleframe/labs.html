<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C9A962;--gold-light:#E8D5A3;--gradient:linear-gradient(135deg,#C9A962,#E8D5A3 50%,#C9A962)}
html{background:#000;color-scheme:dark}
body{font-family:'Outfit',sans-serif;background:#000;color:#FAFAFA;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;overflow-x:hidden;position:relative}
.glow{position:fixed;width:500px;height:500px;border-radius:50%;background:rgba(201,169,98,.06);filter:blur(120px);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.frame{width:74px;height:74px;margin-bottom:34px;position:relative;animation:pulse 4s ease-in-out infinite}
.frame svg{width:100%;height:100%}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.6rem,7vw,4.5rem);font-weight:300;line-height:1.05;margin-bottom:22px}
h1 span{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:400}
p{color:rgba(250,250,250,.7);max-width:520px;font-size:1.05rem;line-height:1.8;margin-bottom:40px}
.actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:9px;padding:15px 32px;font-size:.8rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;border:1px solid var(--gold);transition:all .4s ease}
.btn.solid{background:var(--gold);color:#000}.btn.solid:hover{background:transparent;color:var(--gold)}
.btn.ghost{color:#FAFAFA;border-color:rgba(201,169,98,.3)}.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.back{position:fixed;top:30px;left:30px;display:inline-flex;align-items:center;gap:8px;color:rgba(250,250,250,.6);text-decoration:none;font-size:.78rem;letter-spacing:1px;text-transform:uppercase;transition:color .3s}
.back svg{width:16px;height:16px;stroke:var(--gold)}.back:hover{color:var(--gold)}
@media(prefers-reduced-motion:reduce){.frame{animation:none}}
</style>
