# OMEGA Atelier — Supabase project config.
# Version-controlled so `supabase db push` / `supabase link` can apply the auth
# setup (email templates, providers) instead of hand-clicking the dashboard.
# Secrets are NEVER inlined here — providers read them from env (see below).

project_id = "omega-atelier"

[auth]
# The site users are sent back to after auth. Override per environment.
# Locally this is the dev server; in production it is the deployed origin
# (e.g. https://<user>.github.io/OmegaAtelier/).
site_url = "env(SUPABASE_AUTH_SITE_URL)"
# Every origin/path the OAuth + email links may redirect to must be allow-listed
# here (and mirrored in the dashboard → Authentication → URL Configuration).
additional_redirect_urls = [
  "http://localhost:5173/plans",
  "http://localhost:4173/plans",
  "https://nicozrmn.github.io/OmegaAtelier/plans",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
# Require the confirmation e-mail before the account is usable (seriös).
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

# Branded, OMEGA-styled transactional e-mails (Gold/Noir). Paths are relative
# to this file. Mirror these in the dashboard → Authentication → Email Templates
# if you are not deploying config via the CLI.
[auth.email.template.confirmation]
subject = "Bestätige deine E-Mail · OMEGA Atelier"
content_path = "./templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Dein Anmeldelink · OMEGA Atelier"
content_path = "./templates/magic_link.html"

[auth.email.template.recovery]
subject = "Passwort zurücksetzen · OMEGA Atelier"
content_path = "./templates/recovery.html"

[auth.email.template.email_change]
subject = "Neue E-Mail-Adresse bestätigen · OMEGA Atelier"
content_path = "./templates/email_change.html"

[auth.email.template.invite]
subject = "Du bist eingeladen · OMEGA Atelier"
content_path = "./templates/invite.html"

# ── Social login ────────────────────────────────────────────────────────────
# Google ist der einzige OAuth-Anbieter (neben E-Mail + Passwort).
# Client ID und Secret kommen aus der Google Cloud Console und werden als
# Umgebungsvariablen gereicht — niemals ins Repo. Entweder dort setzen, wo die
# Supabase CLI läuft, oder denselben Anbieter im Dashboard unter
# Authentication → Providers eintragen.
#
# Apple wurde entfernt: es verlangt eine kostenpflichtige Developer-
# Mitgliedschaft und ein serverseitig aus einem .p8-Schlüssel signiertes
# Client-Secret, das alle sechs Monate neu erzeugt werden muss. Für einen
# zweiten Anbieter neben Google rechnet sich das nicht.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# skip_nonce_check nur beim impliziten Flow; der Default bleibt streng.

# ── Edge Functions ────────────────────────────────────────────────────────
#
# `vendor-relay` ist das CORS-Relay für die Hersteller-Clouds. Es MUSS ohne
# JWT-Prüfung laufen: der Aufruf kommt aus dem Browser mit den Hersteller-
# Zugangsdaten des Nutzers, nicht mit einem Supabase-Token. Mit der
# Standardeinstellung (verify_jwt = true) antwortet Supabase auf jede Anfrage
# mit 401, bevor sie den Hersteller erreicht — im Browser sichtbar nur als
# „Load failed", also exakt das Symptom, das man ohne Relay auch hätte.
#
# Das ist kein Sicherheitsloch: die Function trägt keine eigenen Rechte. Wer
# sie aufruft, muss seine eigenen Hersteller-Zugangsdaten mitschicken.
[functions.vendor-relay]
verify_jwt = false
